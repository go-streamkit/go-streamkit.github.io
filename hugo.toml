baseURL = "https://go-streamkit.github.io/"
locale = "en-us"
title = "go-streamkit"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/favicon.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 5.36:1, bright on the dark background 7.96:1.
  base = "#0e7490"
  deep = "#094758"
  bright = "#06b6d4"
  shadow = "rgba(14,116,144,.7)"
  glow = "rgba(14,116,144,.6)"
  wash = "rgba(14,116,144,.10)"
  washDeep = "rgba(9,71,88,.06)"
  chipBg = "#e1f6fa"
  chipBorder = "#b4e9f2"
  chipFg = "#094758"
  chipBgDark = "rgba(6,182,212,.14)"
  chipBorderDark = "rgba(6,182,212,.32)"
  chipFgDark = "#76d7e7"
  statsEnd = "#c3edf5"
  bandText = "#d7f3f8"
  accent = "#0e7490"
  accentDark = "#06b6d4"

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://pkg.go.dev/github.com/go-streamkit/streamkit"
  label = "Reference"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-streamkit"
  label = "GitHub"

# The architectures the tests RUN on, read from the library's CI.
[params.mantra]
  goarch = ["amd64", "arm64", "riscv64", "loong64", "ppc64le", "s390x"]
